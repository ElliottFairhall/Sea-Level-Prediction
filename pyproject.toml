[project]
name = "sea-level-prediction"
version = "0.1.0"
description = "Streamlit dashboard for analyzing and predicting sea levels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.66.1",
    "pandas>=3.1.0",
    "numpy>=2.4.0",
    "plotly>=7.1.0",
    "scipy>=1.17.0",
    "requests>=2.32.0",
    "Pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Long sentences of page copy and credit text; prose is not wrapped mid-sentence.
"src/ui.py" = ["E501"]
"src/sources.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
